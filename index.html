<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HPTRADER</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#080b10;
  --panel:#11161d;
  --panel2:#171d25;
  --border:#252d38;
  --text:#f4f7fb;
  --muted:#8993a1;
  --green:#16c784;
  --green2:#0fa968;
  --red:#ea4d68;
  --blue:#3b82f6;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  padding-bottom:78px;
}

button{
  font-family:inherit;
  border:0;
}

.app{
  max-width:1100px;
  margin:auto;
}

/* TOP BAR */
.topbar{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid var(--border);
  background:#0b0f14;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:.5px;
}

.logo span{
  color:var(--green);
}

.top-icons{
  display:flex;
  gap:10px;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  background:var(--panel2);
  color:white;
  font-size:19px;
}

/* BALANCE */
.balance{
  margin:14px;
  padding:20px;
  border:1px solid var(--border);
  border-radius:18px;
  background:linear-gradient(145deg,#151b23,#0e131a);
}

.balance-label{
  color:var(--muted);
  font-size:13px;
}

.balance-value{
  font-size:31px;
  font-weight:800;
  margin-top:7px;
}

.balance-row{
  display:flex;
  justify-content:space-between;
  align-items:end;
}

.profit{
  color:var(--green);
  font-size:14px;
  margin-top:8px;
}

.deposit{
  background:var(--green);
  color:#04140d;
  padding:11px 16px;
  border-radius:11px;
  font-weight:800;
}

/* MARKET */
.section{
  padding:0 14px;
  margin-top:18px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.section-title h2{
  font-size:18px;
}

.section-title span{
  color:var(--muted);
  font-size:13px;
}

.market-list{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:4px;
}

.market-list::-webkit-scrollbar{
  display:none;
}

.market{
  min-width:150px;
  padding:14px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  cursor:pointer;
}

.market.active{
  border-color:var(--green);
  box-shadow:0 0 0 1px rgba(22,199,132,.15);
}

.market-name{
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.market-price{
  font-size:18px;
  font-weight:700;
  margin:7px 0;
}

.up{
  color:var(--green);
}

.down{
  color:var(--red);
}

/* CHART */
.chart-card{
  margin:14px;
  padding:16px;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--panel);
}

.chart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.selected-name{
  font-weight:700;
}

.selected-price{
  font-size:24px;
  font-weight:800;
  margin-top:5px;
}
